server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name www.azraelkaxi.top _;

    access_log /www/apps/mainweb/logs/access.log;
    error_log /www/apps/mainweb/logs/error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /www/apps/mainweb/data/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://www.azraelkaxi.top$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.azraelkaxi.top;

    root /www/apps/mainweb/app;
    index index.html;

    ssl_certificate /www/apps/mainweb/data/ssl/fullchain.pem;
    ssl_certificate_key /www/apps/mainweb/data/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    access_log /www/apps/mainweb/logs/access.log;
    error_log /www/apps/mainweb/logs/error.log;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /favicon.svg {
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~* \.(js|css|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
