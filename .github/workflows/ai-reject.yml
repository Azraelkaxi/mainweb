name: AI Reject

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  reject:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.state == 'open' &&
      github.event.comment.user.login == github.repository_owner &&
      contains(github.event.comment.body, '/reject') &&
      (
        contains(github.event.issue.labels.*.name, 'ai:awaiting-approval') ||
        contains(github.event.issue.labels.*.name, 'ai:failed')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Close issue
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$NUMBER" --remove-label "ai:awaiting-approval" || true
          gh issue edit "$NUMBER" --remove-label "ai:failed" || true
          gh issue comment "$NUMBER" --body "已取消，不再实现这个需求。"
          gh issue close "$NUMBER" --reason "not planned"
